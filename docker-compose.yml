version: "3.8"

# 使用预构建镜像时，请在同目录下创建 .env 文件：
# DOCKER_REGISTRY=ghcr.io
# DOCKER_IMAGE_PREFIX=your-github-username/your-repo-name
# DOCKER_TAG=latest
#
# 然后执行：docker-compose pull && docker-compose up -d
# 如需本地重新构建，保留 build 字段即可直接 docker-compose up -d --build

services:
  backend:
    image: ${DOCKER_REGISTRY:-ghcr.io}/${DOCKER_IMAGE_PREFIX:-your-name/your-repo}/backend:${DOCKER_TAG:-latest}
    build: ./backend
    container_name: dingding_backend
    restart: unless-stopped
    volumes:
      - dingding_data:/data
      - ./config.json:/data/config.json:ro
    environment:
      - DATABASE_URL=sqlite:////data/dingding.db
    networks:
      - dingding_net

  frontend:
    image: ${DOCKER_REGISTRY:-ghcr.io}/${DOCKER_IMAGE_PREFIX:-your-name/your-repo}/frontend:${DOCKER_TAG:-latest}
    build: ./frontend
    container_name: dingding_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - dingding_net

volumes:
  dingding_data:

networks:
  dingding_net:
    driver: bridge
