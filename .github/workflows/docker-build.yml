name: Build and Push Docker Images

"on":
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository }}/backend
  FRONTEND_IMAGE: ${{ github.repository }}/frontend

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify registry login
        run: |
          echo "Registry: ${{ env.REGISTRY }}"
          echo "Image: ${{ env.BACKEND_IMAGE }}"
          docker info || true

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Verify pushed image in registry
        run: |
          echo "Inspecting first tag: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}"
          docker buildx imagetools inspect ${{ fromJSON(steps.meta.outputs.json).tags[0] }} || true

      - name: Export backend image as tar
        run: |
          mkdir -p /tmp/images
          docker pull ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          docker save ${{ fromJSON(steps.meta.outputs.json).tags[0] }} -o /tmp/images/backend.tar
          ls -lh /tmp/images/backend.tar

      - name: Upload backend image artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-image-tar
          path: /tmp/images/backend.tar
          retention-days: 7

  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify registry login
        run: |
          echo "Registry: ${{ env.REGISTRY }}"
          echo "Image: ${{ env.FRONTEND_IMAGE }}"
          docker info || true

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Verify pushed image in registry
        run: |
          echo "Inspecting first tag: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}"
          docker buildx imagetools inspect ${{ fromJSON(steps.meta.outputs.json).tags[0] }} || true

      - name: Export frontend image as tar
        run: |
          mkdir -p /tmp/images
          docker pull ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          docker save ${{ fromJSON(steps.meta.outputs.json).tags[0] }} -o /tmp/images/frontend.tar
          ls -lh /tmp/images/frontend.tar

      - name: Upload frontend image artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image-tar
          path: /tmp/images/frontend.tar
          retention-days: 7
